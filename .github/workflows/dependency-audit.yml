name: Dependency Audit

# Checks the locked dependencies against the npm registry's security advisories: on every
# change to them, every week (an advisory can be published for a version already locked), and
# by hand on a release candidate. It installs and runs nothing: npm reads package-lock.json and
# asks the registry, and any advisory, whatever its severity, fails the check.
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: No known vulnerability in the locked dependencies
        run: npm audit --package-lock-only --audit-level=low
