name: Jev Exact-Head Qualification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: jev-exact-head-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  jev:
    name: Jev exact-head qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require an internal candidate branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Jev qualification intentionally requires a trusted internal branch because repository secrets are not exposed to fork pull requests."
            exit 1
          fi

      - name: Check out exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check out the Jev runner from the base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The runner that judges a candidate, and holds the key, is never the candidate's own
          # copy: a branch could otherwise change it to pass itself, out of the reviewed diff.
          ref: ${{ github.event.pull_request.base.sha }}
          path: jev-runner
          sparse-checkout: .claude/skills/jev
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check generated component records
        shell: bash
        run: |
          set -euo pipefail
          # Component records generated from a pinned upstream source (packages/component-sources/
          # src/<source>-records.mjs) are data, about a megabyte, past what Jev can read. Jev gets
          # each one's path, size, sha256 and contents' summary instead of its text, and only when
          # the file is nothing but data (comment lines, then `export default <JSON>;`) and its
          # sha256 is the one the license register pins. Any other file fails the job. The
          # generator, the register entry and the tests that check the records are in the diff.
          git ls-files -z -- 'packages/component-sources/src/*-records.mjs' | node -e '
            const fs = require("node:fs");
            const { createHash } = require("node:crypto");
            const paths = fs.readFileSync(0, "utf8").split("\0").filter(Boolean);
            const register = JSON.parse(fs.readFileSync("docs/provenance/LICENSE_REGISTER.json", "utf8"));
            const pinned = new Map(register.entries.flatMap((entry) => Object.entries(entry.vendored ?? {})));
            const lines = [];
            for (const path of paths) {
              const bytes = fs.readFileSync(path);
              const sha = createHash("sha256").update(bytes).digest("hex");
              if (pinned.get(path) !== sha) throw new Error(`${path}: its sha256 ${sha} is not the one the license register pins`);
              const match = /^(?:\/\/[^\n]*\n)*export default (\{[\s\S]*\});\n$/u.exec(bytes.toString("utf8"));
              if (match === null) throw new Error(`${path}: not comment lines then export default <JSON>;`);
              const data = JSON.parse(match[1]);
              if (!Array.isArray(data.components)) throw new Error(`${path}: has no components list`);
              lines.push(`${path} bytes=${bytes.length} sha256=${sha} source=${data.source} repository=${data.repository} commit=${data.commit} generatedBy=${data.generatedBy} components=${data.components.length}`);
            }
            fs.writeFileSync("jev-generated-data.txt", lines.join("\n") + (lines.length ? "\n" : ""));
          '
          cat jev-generated-data.txt

      - name: Build exact-head qualification state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          printf "%s\n" "${{ github.event.pull_request.base.sha }}" > jev-base-sha.txt
          printf "%s\n" "${{ github.event.pull_request.head.sha }}" > jev-head-sha.txt
          git diff --name-status "origin/${{ github.event.pull_request.base.ref }}...HEAD" > jev-changed-files.txt
          git ls-tree -r HEAD .claude/skills > jev-vendored-skill-tree.txt
          git diff --no-ext-diff --binary "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- . ":(exclude).claude/skills/**" ":(exclude,glob)packages/component-sources/src/*-records.mjs" > jev-authored.diff
          {
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}"
            echo "CHANGED_FILES"
            cat jev-changed-files.txt
            echo "VENDORED_SKILL_TREE"
            cat jev-vendored-skill-tree.txt
            echo "GENERATED_DATA (checked: data only, sha256 pinned by docs/provenance/LICENSE_REGISTER.json)"
            cat jev-generated-data.txt
            echo "AUTHORED_DIFF"
            cat jev-authored.diff
          } > jev-candidate.txt
          test -s jev-candidate.txt

      - name: Run Jev on exact candidate
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TYPESAFE_API_KEY:-}" || { echo "TYPESAFE_API_KEY repository secret is missing."; exit 1; }
          python jev-runner/.claude/skills/jev/scripts/jev --version
          python jev-runner/.claude/skills/jev/scripts/jev run commit -s @jev-candidate.txt --json > jev-commit.json

      - name: Validate Jev evidence and secret-leak judgment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const raw = JSON.parse(fs.readFileSync('jev-commit.json', 'utf8'));
          const head = fs.readFileSync('jev-head-sha.txt', 'utf8').trim();
          const base = fs.readFileSync('jev-base-sha.txt', 'utf8').trim();

          if (!raw || typeof raw !== 'object' || !raw.answers) {
            throw new Error('Jev returned no answers object');
          }

          const required = ['type', 'has_secret', 'breaking', 'risk'];
          for (const key of required) {
            if (!raw.answers[key]) throw new Error(`Jev response missing answer: ${key}`);
          }

          const evidence = {
            schema_version: '1',
            base_sha: base,
            head_sha: head,
            provider: raw.provider ?? null,
            model: raw.model ?? null,
            answers: raw.answers,
            usage: raw.usage ?? null,
          };

          fs.writeFileSync('jev-evidence.json', JSON.stringify(evidence, null, 2) + '\n');

          const secret = raw.answers.has_secret;
          // Also surface the judgments as a check-run annotation, which the
          // REST API can read when job logs and artifacts are out of reach.
          // Workflow-command data must escape %, CR and LF.
          const escape = (value) => String(value).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const summary = [
            `head=${head}`,
            `base=${base}`,
            `provider=${evidence.provider}`,
            `model=${evidence.model}`,
            `type=${raw.answers.type.choice}`,
            `breaking=${raw.answers.breaking.yes}`,
            `risk=${raw.answers.risk.label} (${raw.answers.risk.score})`,
            `secret_leak=${secret.yes} (p=${secret.noul})`,
          ].join('; ');
          console.log(`::notice title=Jev exact-head evidence::${escape(summary)}`);
          console.log(`JEV_PROVIDER=${escape(`${evidence.provider}`)}`);
          console.log(`JEV_MODEL=${escape(`${evidence.model}`)}`);
          console.log(`JEV_CHANGE_TYPE=${escape(`${raw.answers.type.choice}`)}`);
          console.log(`JEV_BREAKING=${raw.answers.breaking.yes}`);
          console.log(`JEV_RISK=${escape(`${raw.answers.risk.label} (${raw.answers.risk.score})`)}`);
          console.log(`JEV_SECRET_LEAK=${secret.yes} (p=${secret.noul})`);

          if (secret.yes === true) {
            throw new Error(`Jev flagged a possible secret leak in exact head ${head} (p=${secret.noul}).`);
          }
          NODE

      - name: Upload exact-head Jev evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jev-exact-head-${{ github.event.pull_request.head.sha }}
          path: |
            jev-base-sha.txt
            jev-head-sha.txt
            jev-changed-files.txt
            jev-vendored-skill-tree.txt
            jev-generated-data.txt
            jev-authored.diff
            jev-commit.json
            jev-evidence.json
          if-no-files-found: error
          retention-days: 14
