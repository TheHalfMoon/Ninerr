# Add this entry to ~/.codex/config.toml, keeping the servers already there.
# Use the path `ninerr doctor` prints for bin/ninerr.mjs. No credential is needed:
# Codex starts the engine itself, and only Codex can talk to it.
[mcp_servers.ninerr]
command = "node"
args = ["/ABSOLUTE/PATH/TO/ninerr/bin/ninerr.mjs", "mcp"]
startup_timeout_sec = 20
# Deleting waits up to 120 seconds for your answer, so the tool timeout is longer.
tool_timeout_sec = 150
